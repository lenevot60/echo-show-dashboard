<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>YouTube</title>
<!--
  YouTube full screen on the Echo Show 11. The skill starts this page as a web app (Alexa.Presentation.HTML.Start)
  with a first list in `data`; searches and categories go to the skill (alexa.skill.sendMessage), which asks the
  YouTube Data API and answers with a new list. Videos play in the official YouTube IFrame player.
-->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.html.games.alexa.a2z.com/alexa-html/latest/alexa-html.js"></script>
<style>
  :root {
    --achter: #0f0f0f;
    --vlak: #272727;
    --vlak2: #3f3f3f;
    --tekst: #f1f1f1;
    --tekst2: #aaaaaa;
    --rood: #ff0033;
    --rand: #303030;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--achter); color: var(--tekst); font-family: Roboto, Arial, sans-serif; overflow: hidden; user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 24px; padding: 14px 28px; }
  .logo { display: flex; align-items: center; gap: 6px; font-size: 26px; font-weight: 700; letter-spacing: -1px; flex: none; }
  .logo svg { width: 46px; height: 32px; }
  form { flex: 1; display: flex; max-width: 760px; margin: 0 auto; }
  #zoekveld { flex: 1; min-width: 0; height: 52px; padding: 0 22px; font: 400 20px Roboto, Arial, sans-serif; color: var(--tekst); background: #121212; border: 1px solid var(--rand); border-right: 0; border-radius: 26px 0 0 26px; outline: none; user-select: text; }
  #zoekveld:focus { border-color: #1c62b9; }
  #zoekveld::placeholder { color: #888; }
  form button { width: 78px; height: 52px; background: var(--vlak); border: 1px solid var(--rand); border-radius: 0 26px 26px 0; display: grid; place-items: center; }
  #mic { width: 52px; height: 52px; border-radius: 50%; background: var(--vlak); display: grid; place-items: center; flex: none; }
  #mic.aan { background: var(--rood); }
  header svg.icoon { width: 26px; height: 26px; fill: var(--tekst); }

  #chips { display: flex; gap: 12px; padding: 4px 28px 14px; overflow-x: auto; scrollbar-width: none; flex: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 44px; padding: 0 20px; border-radius: 10px; background: var(--vlak); font-size: 18px; font-weight: 500; }
  .chip.actief { background: var(--tekst); color: var(--achter); }

  main { flex: 1; overflow-y: auto; padding: 4px 28px 40px; -webkit-overflow-scrolling: touch; }
  #kop { font-size: 22px; font-weight: 700; margin: 4px 0 16px; }
  #melding { color: var(--tekst2); font-size: 18px; margin: 0 0 16px; }
  #melding:empty { display: none; }
  #raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 28px 18px; transition: opacity .2s; }
  #raster.laden { opacity: .35; }
  .kaart { text-align: left; padding: 0; display: block; align-self: start; }
  .kaart:active .duim img { transform: scale(.97); }
  .duim { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--vlak); }
  .duim img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .15s; }
  .duur { position: absolute; right: 8px; bottom: 8px; padding: 2px 6px; border-radius: 6px; background: rgba(0, 0, 0, .8); font-size: 15px; font-weight: 500; }
  .duur.live { background: #cc0000; }
  .kaart h3 { margin: 12px 0 4px; font-size: 18px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .kaart p { margin: 0; color: var(--tekst2); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #laag { position: fixed; inset: 0; background: #000; z-index: 10; }
  #laag[hidden] { display: none; }
  #speler, #laag iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #terug { position: absolute; top: 18px; left: 18px; z-index: 11; height: 52px; padding: 0 24px 0 16px; border-radius: 26px; background: rgba(0, 0, 0, .6); font-size: 19px; font-weight: 500; display: flex; align-items: center; gap: 6px; opacity: 1; transition: opacity .6s; }
  #terug.stil { opacity: .35; }
  #terug svg { width: 26px; height: 26px; fill: var(--tekst); }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); max-width: 80%; padding: 14px 22px; border-radius: 10px; background: #e8e8e8; color: #0f0f0f; font-size: 18px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 20; pointer-events: none; }
  #toast.zichtbaar { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo" aria-label="YouTube">
      <svg viewBox="0 0 160 112" aria-hidden="true"><path fill="#ff0033" d="M28,0 L132,0 Q160,0 160,28 L160,84 Q160,112 132,112 L28,112 Q0,112 0,84 L0,28 Q0,0 28,0 Z"/><path fill="#fff" d="M64,32 L64,80 L106,56 Z"/></svg>
      <span>YouTube</span>
    </div>
    <form id="zoek" autocomplete="off">
      <input id="zoekveld" type="search" placeholder="Zoeken" enterkeyhint="search" aria-label="Zoeken">
      <button type="submit" aria-label="Zoeken"><svg class="icoon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
    </form>
    <button id="mic" aria-label="Zoeken met je stem"><svg class="icoon" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5.3-3a5.3 5.3 0 0 1-10.6 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-1.7z"/></svg></button>
  </header>
  <nav id="chips"></nav>
  <main>
    <h1 id="kop">YouTube</h1>
    <p id="melding"></p>
    <div id="raster"></div>
  </main>
</div>
<div id="laag" hidden>
  <div id="speler"></div>
  <button id="terug"><svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>Terug</button>
</div>
<div id="toast" role="status"></div>
<script>
'use strict';
const STANDAARD_CATEGORIEEN = [{ id: '', naam: 'Populair' }];
const staat = { alexa: null, categorie: '', speler: null, ytKlaar: false, wacht: null, stilTimer: 0 };
const $ = (id) => document.getElementById(id);

function toast(tekst) {
  const t = $('toast');
  t.textContent = tekst;
  t.classList.add('zichtbaar');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('zichtbaar'), 4000);
}

function stuur(bericht) {
  if (!staat.alexa) { toast('Deze pagina werkt binnen de YouTube-skill op de Echo Show.'); return false; }
  try { staat.alexa.skill.sendMessage(bericht); return true; } catch (e) { toast('Bericht aan Alexa mislukt.'); return false; }
}

function chips(categorieen) {
  const nav = $('chips');
  nav.replaceChildren();
  for (const c of categorieen && categorieen.length ? categorieen : STANDAARD_CATEGORIEEN) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = c.naam;
    b.dataset.id = c.id;
    b.addEventListener('click', () => {
      if (stuur({ type: 'categorie', categorie: c.id })) laden(c.naam);
    });
    nav.append(b);
  }
  markeer();
}

function markeer() {
  for (const b of document.querySelectorAll('.chip')) b.classList.toggle('actief', b.dataset.id === staat.categorie);
}

function laden(kop) {
  $('kop').textContent = kop;
  $('melding').textContent = '';
  $('raster').classList.add('laden');
}

function toon(lijst) {
  lijst = lijst || {};
  $('raster').classList.remove('laden');
  staat.categorie = lijst.zoekterm ? null : (lijst.categorie || '');
  markeer();
  $('kop').textContent = lijst.titel || 'YouTube';
  const items = lijst.items || [];
  $('melding').textContent = lijst.fout ? `YouTube gaf geen lijst (${lijst.fout}).` : (items.length ? '' : 'Geen video’s gevonden.');
  const raster = $('raster');
  raster.replaceChildren();
  for (const v of items) {
    const kaart = document.createElement('button');
    kaart.className = 'kaart';
    const duim = document.createElement('div');
    duim.className = 'duim';
    const img = document.createElement('img');
    img.src = v.thumb;
    img.alt = '';
    img.loading = 'lazy';
    duim.append(img);
    if (v.duur) {
      const d = document.createElement('span');
      d.className = v.duur === 'LIVE' ? 'duur live' : 'duur';
      d.textContent = v.duur;
      duim.append(d);
    }
    const h = document.createElement('h3');
    h.textContent = v.titel;
    const p = document.createElement('p');
    p.textContent = v.kanaal;
    kaart.append(duim, h, p);
    kaart.addEventListener('click', () => speel(v.id));
    raster.append(kaart);
  }
  document.querySelector('main').scrollTop = 0;
}

const FOUTEN = {
  2: 'Deze video heeft een ongeldig adres.',
  5: 'Deze video kan hier niet worden afgespeeld.',
  100: 'Deze video bestaat niet meer of is privé.',
  101: 'De maker staat afspelen buiten YouTube niet toe.',
  150: 'De maker staat afspelen buiten YouTube niet toe.',
};

function terugZichtbaar() {
  const t = $('terug');
  t.classList.remove('stil');
  clearTimeout(staat.stilTimer);
  staat.stilTimer = setTimeout(() => t.classList.add('stil'), 4000);
}

function speel(id) {
  $('laag').hidden = false;
  terugZichtbaar();
  if (!staat.ytKlaar) { staat.wacht = id; return; }
  if (staat.speler) { staat.speler.loadVideoById(id); return; }
  staat.speler = new YT.Player('speler', {
    videoId: id,
    width: '100%',
    height: '100%',
    playerVars: { autoplay: 1, playsinline: 1, rel: 0, fs: 0, origin: location.origin },
    events: {
      onReady: (e) => e.target.playVideo(),
      onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) sluit(); },
      onError: (e) => { toast(FOUTEN[e.data] || `Afspelen mislukt (${e.data}).`); sluit(); },
    },
  });
}

function sluit() {
  if (staat.speler && staat.speler.stopVideo) staat.speler.stopVideo();
  staat.wacht = null;
  $('laag').hidden = true;
}

window.onYouTubeIframeAPIReady = () => {
  staat.ytKlaar = true;
  if (staat.wacht) { const id = staat.wacht; staat.wacht = null; speel(id); }
};

$('terug').addEventListener('click', sluit);
$('zoek').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = $('zoekveld').value.trim();
  if (!q) return;
  $('zoekveld').blur();
  if (stuur({ type: 'zoek', zoekterm: q })) laden(`Zoeken naar “${q}”…`);
});
$('mic').addEventListener('click', () => {
  if (!staat.alexa || !staat.alexa.voice) { toast('Zeg: “Alexa, search for …”'); return; }
  try {
    staat.alexa.voice.requestMicrophoneOpen({
      onOpened: () => $('mic').classList.add('aan'),
      onClosed: () => $('mic').classList.remove('aan'),
      onError: () => { $('mic').classList.remove('aan'); toast('Zeg: “Alexa, search for …”'); },
    });
  } catch (e) {
    toast('Zeg: “Alexa, search for …”');
  }
});

const yt = document.createElement('script');
yt.src = 'https://www.youtube.com/iframe_api';
document.head.append(yt);

function ontvang(m) {
  if (!m) return;
  if (m.type === 'lijst') { sluit(); toon(m.lijst); }
}

chips(STANDAARD_CATEGORIEEN);
if (window.Alexa) {
  Alexa.create({ version: '1.1' })
    .then(({ alexa, message }) => {
      staat.alexa = alexa;
      alexa.skill.onMessage(ontvang);
      try {
        // Lower the video while Alexa listens, so she hears the question.
        alexa.voice.onMicrophoneOpened(() => staat.speler && staat.speler.setVolume && staat.speler.setVolume(15));
        alexa.voice.onMicrophoneClosed(() => staat.speler && staat.speler.setVolume && staat.speler.setVolume(100));
      } catch (e) {
        // Older runtimes have no voice events; the video then simply keeps its volume.
      }
      chips(message && message.categorieen);
      toon(message && message.lijst);
      // The web app session ends after 300 s without interaction; a ping now and then keeps it while a video runs.
      setInterval(() => stuur({ type: 'blijf' }), 60000);
    })
    .catch((e) => { $('melding').textContent = `Alexa niet bereikbaar (${e && e.code ? e.code : e}).`; });
} else {
  $('melding').textContent = 'Deze pagina werkt binnen de YouTube-skill op de Echo Show.';
}
</script>
</body>
</html>
